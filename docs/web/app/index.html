<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' data: blob: https:; worker-src 'self' blob:"
    />
    <title>VRM Desktop Mate</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2233; user-select: none; }
      body.hover { cursor: grab; }
      body.grabbing { cursor: grabbing; }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; }
      #preview { position: fixed; left: 12px; bottom: 12px; display: none; width: 240px;
        border-radius: 10px; overflow: hidden; background: rgba(0,0,0,.55); color: #fff;
        font: 11px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
      #preview canvas { display: block; width: 240px; height: 180px; }
      #preview pre { margin: 0; padding: 6px 8px; white-space: pre-wrap; }
      #gaze-dot { position: fixed; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
        border: 2px solid #f48; display: none; pointer-events: none; }
      #toast { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); padding: 8px 14px;
        border-radius: 8px; background: rgba(0,0,0,.7); color: #fff; font: 13px -apple-system, sans-serif;
        opacity: 0; transition: opacity .3s; pointer-events: none; }
      #mate-menu-btn { position: fixed; right: 12px; top: 12px; width: 40px; height: 40px;
        border: 0; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 19px; }
      #mate-menu { position: fixed; right: 12px; top: 60px; max-height: 75vh; overflow-y: auto;
        display: none; min-width: 230px; padding: 10px 14px; border-radius: 12px;
        background: rgba(20,24,30,.92); color: #fff; font: 14px/1.9 -apple-system, sans-serif;
        backdrop-filter: blur(8px); }
      #mate-menu.open { display: block; }
      #mate-menu label { display: block; cursor: pointer; }
      #mate-menu fieldset { border: 1px solid rgba(255,255,255,.2); border-radius: 8px; margin: 6px 0; }
      #mate-menu button.act { display: inline-block; margin: 2px 4px 2px 0; padding: 3px 10px;
        border: 1px solid rgba(255,255,255,.35); border-radius: 7px; background: transparent; color: #fff; }
      #mate-menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.15); margin: 6px 0; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="gaze-dot"></div>
    <div id="preview"><canvas width="240" height="180"></canvas><pre></pre></div>
    <div id="toast"></div>
    <button id="mate-menu-btn" type="button" aria-label="menu">☰</button>
    <div id="mate-menu"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
